<section class="section about" id="about">
  <div class="container about__grid">
    <div class="about__visual" appReveal data-reveal="left">
      <div class="about__frame">
        <img src="assets/logo-mark.png" alt="Alexapedia" />
        <div class="about__badge">
          <span>Since day one</span>
          <strong>Engineering Digital Excellence</strong>
        </div>
      </div>
    </div>

    <div class="about__content" appReveal data-reveal="right">
      <p class="section-label">About us</p>
      <h2 class="section-title">{{ about.title }}</h2>
      @for (p of about.paragraphs; track p) {
        <p class="about__text">{{ p }}</p>
      }
      <ul class="about__list">
        @for (item of about.highlights; track item) {
          <li>
            <span class="check" aria-hidden="true"></span>
            {{ item }}
          </li>
        }
      </ul>
    </div>
  </div>
</section>
